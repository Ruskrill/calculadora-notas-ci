apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculadora-notas
  labels:
    app: calculadora-notas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculadora-notas
  template:
    metadata:
      labels:
        app: calculadora-notas
    spec:
      containers:
        - name: calculadora-notas
          image: calculadora-notas:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
